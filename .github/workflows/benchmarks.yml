name: Benchmarks

# The BenchmarkDotNet suite (Quantix vs a reference baseline). Kept off the pull-request path
# on purpose: micro-benchmark numbers vary with the runner, and a noisy
# measurement must never be able to block a merge. Run it on demand, and weekly
# so a performance regression still surfaces on its own.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Mondays, 06:00 UTC

permissions:
  contents: read

jobs:
  benchmark:
    name: Run BenchmarkDotNet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Run benchmarks
        run: >
          dotnet run
          --project benchmarks/Quantix.Benchmarks/Quantix.Benchmarks.csproj
          --configuration Release
          -- --filter '*'

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/**
          if-no-files-found: warn
