name: Release

# Triggered by pushing a version tag (for example `v1.0.0`). MinVer turns the tag
# into the package version, the package is published to NuGet, and a GitHub
# release is created. Cutting and pushing the tag is a manual maintainer action.
#
# Publishing uses nuget.org Trusted Publishing: no API key is stored. The job's GitHub
# OIDC token is exchanged for a one-hour NuGet key just before the push. This needs:
#   - a Trusted Publishing policy on nuget.org naming this repository and the workflow
#     file `release.yml` (renaming this file breaks publishing until the policy is updated);
#   - one repository secret, NUGET_USER: the nuget.org profile name (not the email).

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # required to create the GitHub release
  id-token: write  # required to request the OIDC token that NuGet/login exchanges

jobs:
  release:
    name: Pack & publish to NuGet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # MinVer must see the tag and full history to derive the release version.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Third-party notices are current
        run: python3 eng/notices.py --check

      - name: Restore
        run: dotnet restore Quantix.slnx

      - name: Build
        run: dotnet build Quantix.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Quantix.slnx --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/Quantix/Quantix.csproj --configuration Release --no-restore --output artifacts/release-package

      - name: NuGet login (OIDC to temporary API key)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        # The matching .snupkg symbol package in the same folder is pushed
        # automatically alongside the .nupkg.
        # The key reaches the shell as an environment variable, never interpolated into the
        # script text, so it cannot be echoed by a command-line trace.
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/release-package/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        # The tag name is passed through the environment rather than expanded into the script:
        # an expression substituted into 'run' is shell code, so a crafted tag name could inject
        # commands into a job that holds a write token.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: >
          gh release create "$TAG_NAME"
          artifacts/release-package/*.nupkg
          artifacts/release-package/*.snupkg
          --title "Quantix $TAG_NAME"
          --generate-notes
          --verify-tag
